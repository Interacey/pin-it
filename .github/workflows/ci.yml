# CI: format, lints, release build and the window-free unit tests on Windows (the only target).
# The full `cargo test` suite is not run here: it opens real windows and needs an interactive
# desktop with focus, which a runner does not give reliably. Run it locally.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Format, lints, build
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo build --release --locked

      - name: Unit tests that create no windows
        run: cargo test --lib -- placement::tests placement::group:: placement::maximized:: config::tests color::math:: color::ink:: dial::model:: dial::egg:: dial::jingle:: pin_stack:: exclusions::model:: anim::tests exclusions::layout::
