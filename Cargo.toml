[package]
name = "pin_it"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
description = "Pin button in window title bars: pins windows always on top"
license = "MIT"
repository = "https://github.com/Interacey/pin-it"
authors = ["Interacey"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# Tests activate the manifest of the exe (common controls v6) for the EDIT control.
windows = { version = "0.62.2", features = ["Win32_System_ApplicationInstallationAndServicing"] }

[build-dependencies]
embed-resource = "3"
